# Non-secret settings for the Cloud Run service. Edit, then re-run deploy/cloudrun.sh.
# Secrets (database URL, keys, passwords) are NOT kept here: the script stores them in
# Google Secret Manager. The script also sets ENVIRONMENT, API_URL and
# BACKGROUND_SYNC_ENABLED itself.

# Where students open the web app. The Cloudflare Worker forwards /api/* from here to
# Cloud Run, so the API lives on the same address (API_URL is set to this too).
APP_URL: "https://defog.fit"

# AI: mock (canned answers, no key), anthropic or openai. For anthropic, also pass
# ANTHROPIC_API_KEY to the script.
LLM_PROVIDER: "mock"
ANTHROPIC_MODEL: "claude-haiku-5-5"
# OPENAI_BASE_URL: ""
# OPENAI_MODEL: ""

# Email: console prints links to the Cloud Run logs (nobody receives them). For real
# emails use smtp, fill these in, and pass SMTP_PASSWORD to the script.
EMAIL_BACKEND: "console"
EMAIL_FROM: "Defog <no-reply@defog.fit>"
# SMTP_HOST: ""
# SMTP_PORT: "587"
# SMTP_USERNAME: ""
# SMTP_STARTTLS: "true"

# Google sign-in and Calendar. Also pass GOOGLE_CLIENT_SECRET to the script.
# GOOGLE_CLIENT_ID: ""

CORS_ORIGINS: "https://defog.fit,https://www.defog.fit"
SYNC_INTERVAL_MINUTES: "90"
DATABASE_POOL_SIZE: "3"
